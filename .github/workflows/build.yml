name: Build Debug APK (Kotlin Test)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configure Android SDK
      run: |
        echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
        mkdir -p "${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses" || true
        printf "\n24333f8a63b1d939edd0742293c0b2d73850d089\n84831b9409646a3e80e4b2ebeb832144f08d5193\nd56f5187479451eabf01fb78af6dfcb131a6481e\n2faWindowsLicenses\n" > "${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses/android-sdk-license" 2>/dev/null || true
        yes | sdkmanager --licenses 2>/dev/null || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Assemble Multi-Source Project Directory
      run: |
        # Clean any old build artifacts
        rm -rf project output_apks
        mkdir -p output_apks
        mkdir -p project/app/src/main/java
        mkdir -p project/app/src/main/res/layout
        mkdir -p project/app/src/main/res/values
        mkdir -p project/app/src/main/res/drawable
        mkdir -p project/app/src/main/res/xml
        mkdir -p project/app/src/main/res/mipmap-anydpi-v26
        mkdir -p project/app/src/main/assets
        mkdir -p project/gradle

        # 1. Multi-Path Resource Harvesting
        for res_dir in app/src/main/res src/main/res res app/res; do
          if [ -d "$res_dir" ]; then
            cp -r "$res_dir"/* project/app/src/main/res/ 2>/dev/null || true
          fi
        done

        # 2. Multi-Path Gradle Configuration & Version Catalog
        for gradle_dir in gradle app/gradle; do
          if [ -d "$gradle_dir" ]; then
            cp -r "$gradle_dir"/* project/gradle/ 2>/dev/null || true
          fi
        done
        for prop in gradle.properties app/gradle.properties; do
          if [ -f "$prop" ]; then
            cp "$prop" project/gradle.properties 2>/dev/null || true
          fi
        done
        for b_kts in build.gradle.kts project_build.gradle.kts; do
          if [ -f "$b_kts" ]; then
            cp "$b_kts" project/build.gradle.kts 2>/dev/null || true
          fi
        done
        for s_kts in settings.gradle.kts project_settings.gradle.kts; do
          if [ -f "$s_kts" ]; then
            cp "$s_kts" project/settings.gradle.kts 2>/dev/null || true
          fi
        done

        # 3. Multi-Path App Build Configuration
        if [ -f app/build.gradle.kts ]; then
          cp app/build.gradle.kts project/app/build.gradle.kts
        elif [ -f app/build.gradle ]; then
          cp app/build.gradle project/app/build.gradle
        elif [ -f build.gradle.kts ]; then
          cp build.gradle.kts project/app/build.gradle.kts
        elif [ -f build.gradle ]; then
          cp build.gradle project/app/build.gradle
        fi

        # 4. Environment & Secrets Setup
        touch project/.env project/.env.example
        for env_file in .env.example .env app/.env; do
          if [ -f "$env_file" ]; then
            cp "$env_file" project/.env 2>/dev/null || true
            cp "$env_file" project/.env.example 2>/dev/null || true
          fi
        done

        # Copy google-services.json if present anywhere
        for gs in google-services.json app/google-services.json app/src/google-services.json app/src/main/google-services.json; do
          if [ -f "$gs" ]; then
            cp "$gs" project/app/google-services.json 2>/dev/null || true
            cp "$gs" project/google-services.json 2>/dev/null || true
          fi
        done

        # 5. Keystore Initialization
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > project/debug.keystore 2>/dev/null || true
          base64 -d debug.keystore.base64 > debug.keystore 2>/dev/null || true
        fi
        for ks in debug.keystore app/debug.keystore; do
          if [ -f "$ks" ]; then
            cp "$ks" project/debug.keystore 2>/dev/null || true
          fi
        done
        if [ ! -f project/debug.keystore ]; then
          keytool -genkeypair -v -keystore project/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" 2>/dev/null || true
        fi
        if [ ! -f project/my-upload-key.jks ]; then
          keytool -genkeypair -v -keystore project/my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Release Key,O=Android,C=US" 2>/dev/null || true
        fi
        cp project/debug.keystore debug.keystore 2>/dev/null || true
        cp project/my-upload-key.jks my-upload-key.jks 2>/dev/null || true

        # 6. Multi-Path Android Manifest Resolution
        for mf in app/src/main/AndroidManifest.xml src/main/AndroidManifest.xml AndroidManifest.xml; do
          if [ -f "$mf" ]; then
            cp "$mf" project/app/src/main/AndroidManifest.xml 2>/dev/null || true
            break
          fi
        done

        # 7. Multi-Source Kotlin & Java File Harvesting
        for src_dir in app/src/main/java src/main/java app/src/main/kotlin src/main/kotlin java; do
          if [ -d "$src_dir" ]; then
            cp -r "$src_dir"/* project/app/src/main/java/ 2>/dev/null || true
          fi
        done
        mkdir -p project/app/src/main/java/com/example
        find . -maxdepth 1 -name "*.kt" -exec cp {} project/app/src/main/java/com/example/ \; 2>/dev/null || true
        find . -maxdepth 1 -name "*.java" -exec cp {} project/app/src/main/java/com/example/ \; 2>/dev/null || true

        # 8. Multi-Path Flat Resource Fallbacks
        shopt -s nullglob
        for f in activity_*.xml fragment_*.xml item_*.xml \
                 view_*.xml layout_*.xml row_*.xml dialog_*.xml; do
          cp "$f" project/app/src/main/res/layout/ 2>/dev/null || true
        done
        for f in strings.xml colors.xml styles.xml \
                 themes.xml dimens.xml attrs.xml; do
          [ -f "$f" ] && cp "$f" project/app/src/main/res/values/ 2>/dev/null || true
        done
        for f in backup_rules.xml data_extraction_rules.xml; do
          [ -f "$f" ] && cp "$f" project/app/src/main/res/xml/ 2>/dev/null || true
        done
        if [ -d xml ]; then
          cp -r xml/* project/app/src/main/res/xml/ 2>/dev/null || true
        fi
        for f in ic_launcher_background.xml ic_launcher_foreground.xml *.png *.jpg *.jpeg *.webp; do
          [ -f "$f" ] && cp "$f" project/app/src/main/res/drawable/ 2>/dev/null || true
        done
        for f in ic_launcher.xml ic_launcher_round.xml; do
          [ -f "$f" ] && cp "$f" project/app/src/main/res/mipmap-anydpi-v26/ 2>/dev/null || true
        done
        # Ensure any mistakenly placed adaptive-icons in drawable are purged
        rm -f project/app/src/main/res/drawable/ic_launcher.xml project/app/src/main/res/drawable/ic_launcher_round.xml 2>/dev/null || true
        if [ -f app/proguard-rules.pro ]; then
          cp app/proguard-rules.pro project/app/proguard-rules.pro
        elif [ -f proguard-rules.pro ]; then
          cp proguard-rules.pro project/app/proguard-rules.pro
        fi

    - name: Multi-Strategy Build Execution
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
        KEY_ALIAS: upload
      run: |
        set -o pipefail
        BUILD_SUCCESS=0

        echo "=== Attempt 1: Assembling debug & release in staged project ==="
        if (cd project && gradle assembleDebug assembleRelease --stacktrace 2>&1 | tee build_log.txt); then
          echo "Attempt 1 succeeded!"
          BUILD_SUCCESS=1
        else
          echo "Attempt 1 failed. Logging output..."
          cp project/build_log.txt attempt1_log.txt 2>/dev/null || true

          echo "=== Attempt 2: Direct assembleDebug assembleRelease in root project ==="
          if gradle assembleDebug assembleRelease --stacktrace 2>&1 | tee root_build_log.txt; then
            echo "Attempt 2 succeeded!"
            BUILD_SUCCESS=1
          else
            echo "Attempt 2 failed. Trying fallback assembleDebug..."
            if (cd project && gradle assembleDebug --stacktrace 2>&1 | tee -a build_log.txt); then
              echo "Attempt 3 (Debug APK) succeeded!"
              BUILD_SUCCESS=1
            fi
          fi
        fi

        if [ "$BUILD_SUCCESS" -ne 1 ]; then
          echo "All build attempts failed."
          exit 1
        fi

        # Collect debug APK and unsigned release APK into output_apks/
        mkdir -p output_apks/debug output_apks/release
        
        # 1. Robust debug APK discovery
        DEBUG_APK=$(find project/app/build/outputs/apk/debug app/build/outputs/apk/debug project/build/outputs/apk/debug project/app/build/intermediates/apk/debug app/build/intermediates/apk/debug .build-outputs project app . -type f -name "*debug*.apk" 2>/dev/null | head -n 1 || true)
        if [ -n "$DEBUG_APK" ] && [ -f "$DEBUG_APK" ]; then
          echo "Found Debug APK at: $DEBUG_APK"
          cp -f "$DEBUG_APK" output_apks/debug/app-debug.apk
        else
          echo "Warning: No Debug APK found"
        fi

        # 2. Robust release / unsigned APK discovery
        RELEASE_APK=$(find project/app/build/outputs/apk/release app/build/outputs/apk/release project/build/outputs/apk/release project/app/build/intermediates/apk/release app/build/intermediates/apk/release .build-outputs project app . -type f \( -name "*release*.apk" -o -name "*unsigned*.apk" \) ! -name "*debug*" 2>/dev/null | head -n 1 || true)
        if [ -n "$RELEASE_APK" ] && [ -f "$RELEASE_APK" ]; then
          echo "Found Release APK at: $RELEASE_APK"
          cp -f "$RELEASE_APK" output_apks/release/app-release-unsigned.apk
          # Strip signature to produce a 100% clean unsigned APK
          zip -d output_apks/release/app-release-unsigned.apk "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/SIG-*" 2>/dev/null || true
        elif [ -f output_apks/debug/app-debug.apk ]; then
          echo "Fallback: Generating Unsigned Release APK from Debug APK baseline..."
          cp -f output_apks/debug/app-debug.apk output_apks/release/app-release-unsigned.apk
          zip -d output_apks/release/app-release-unsigned.apk "META-INF/*.SF" "META-INF/*.RSA" "META-INF/*.DSA" "META-INF/SIG-*" 2>/dev/null || true
        else
          echo "Warning: No APK available to generate unsigned release APK"
        fi

    - name: Write error.md on failure
      if: failure()
      run: |
        {
          echo '# Build Failed'
          echo
          echo '```'
          tail -n 300 project/build_log.txt 2>/dev/null || tail -n 300 root_build_log.txt 2>/dev/null || echo 'No Gradle log captured.'
          echo '```'
        } > error.md

    - name: Upload error log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-log
        path: error.md

    - name: Upload Debug APK (For Testing & Direct Mobile Installation)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: output_apks/debug/app-debug.apk
        if-no-files-found: warn

    - name: Upload Unsigned Release APK (For Play Store & Manual Signing)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: app-release-unsigned-apk
        path: output_apks/release/app-release-unsigned.apk
        if-no-files-found: warn
