name: Build Debug APK (Kotlin Test)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Configure Android SDK
      run: |
        echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}" >> $GITHUB_ENV
        mkdir -p "${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses" || true
        printf "\n24333f8a63b1d939edd0742293c0b2d73850d089\n84831b9409646a3e80e4b2ebeb832144f08d5193\nd56f5187479451eabf01fb78af6dfcb131a6481e\n2faWindowsLicenses\n" > "${ANDROID_HOME:-/usr/local/lib/android/sdk}/licenses/android-sdk-license" 2>/dev/null || true
        yes | sdkmanager --licenses 2>/dev/null || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '9.3.1'

    - name: Assemble Project Directory
      run: |
        mkdir -p project/app/src/main/java/com/example
        mkdir -p project/app/src/main/res/layout
        mkdir -p project/app/src/main/res/values
        mkdir -p project/app/src/main/res/drawable
        mkdir -p project/app/src/main/res/xml
        mkdir -p project/app/src/main/res/mipmap-anydpi-v26
        mkdir -p project/app/src/main/assets
        mkdir -p project/gradle

        # 1. Copy complete resource trees
        if [ -d app/src/main/res ]; then
          cp -r app/src/main/res/* project/app/src/main/res/ || true
        fi
        if [ -d res ]; then
          cp -r res/* project/app/src/main/res/ || true
        fi

        # 2. Copy Gradle configuration & Version Catalog
        if [ -d gradle ]; then
          cp -r gradle/* project/gradle/ || true
        fi
        if [ -f gradle.properties ]; then
          cp gradle.properties project/gradle.properties
        fi
        if [ -f build.gradle.kts ]; then
          cp build.gradle.kts project/build.gradle.kts
        elif [ -f build.gradle ]; then
          cp build.gradle project/build.gradle
        fi
        if [ -f settings.gradle.kts ]; then
          cp settings.gradle.kts project/settings.gradle.kts
        elif [ -f settings.gradle ]; then
          cp settings.gradle project/settings.gradle
        fi

        # 3. Copy app-level build configuration
        if [ -f app/build.gradle.kts ]; then
          cp app/build.gradle.kts project/app/build.gradle.kts
        elif [ -f app/build.gradle ]; then
          cp app/build.gradle project/app/build.gradle
        elif [ -f build.gradle ]; then
          cp build.gradle project/app/build.gradle
        fi

        # 4. Copy environment / secrets configs
        if [ -f .env.example ]; then
          cp .env.example project/.env.example
          cp .env.example project/.env
        elif [ -f .env ]; then
          cp .env project/.env
          cp .env project/.env.example
        else
          touch project/.env project/.env.example
        fi

        # 5. Keystores creation for both debug and release
        if [ -f debug.keystore.base64 ]; then
          base64 -d debug.keystore.base64 > project/debug.keystore || true
          base64 -d debug.keystore.base64 > debug.keystore || true
        elif [ -f debug.keystore ]; then
          cp debug.keystore project/debug.keystore
        fi
        if [ ! -f project/debug.keystore ]; then
          keytool -genkeypair -v -keystore project/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
        fi
        if [ ! -f project/my-upload-key.jks ]; then
          keytool -genkeypair -v -keystore project/my-upload-key.jks -storepass android -alias upload -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Release Key,O=Android,C=US" || true
        fi
        cp project/debug.keystore debug.keystore 2>/dev/null || true
        cp project/my-upload-key.jks my-upload-key.jks 2>/dev/null || true

        # 6. Copy Manifest
        if [ -f app/src/main/AndroidManifest.xml ]; then
          cp app/src/main/AndroidManifest.xml project/app/src/main/AndroidManifest.xml
        elif [ -f AndroidManifest.xml ]; then
          cp AndroidManifest.xml project/app/src/main/AndroidManifest.xml
        fi

        # 7. Copy Kotlin & Java source files
        if [ -d app/src/main/java ]; then
          cp -r app/src/main/java/* project/app/src/main/java/ || true
        fi
        find . -maxdepth 1 -name "*.kt" -exec cp {} project/app/src/main/java/com/example/ \; || true
        find . -maxdepth 1 -name "*.java" -exec cp {} project/app/src/main/java/com/example/ \; || true

        # 8. Copy root Layout XMLs if present
        shopt -s nullglob
        for f in activity_*.xml fragment_*.xml item_*.xml \
                 view_*.xml layout_*.xml row_*.xml dialog_*.xml; do
          cp "$f" project/app/src/main/res/layout/
        done

        # 9. Copy root Value XMLs if present
        for f in strings.xml colors.xml styles.xml \
                 themes.xml dimens.xml attrs.xml; do
          [ -f "$f" ] && cp "$f" project/app/src/main/res/values/ || true
        done

        # 10. Copy root XML configs if present
        for f in backup_rules.xml data_extraction_rules.xml; do
          [ -f "$f" ] && cp "$f" project/app/src/main/res/xml/ || true
        done
        if [ -d xml ]; then
          cp -r xml/* project/app/src/main/res/xml/ || true
        fi

        # 11. Copy Drawables, Icons & Mipmaps
        for f in ic_launcher_*.xml ic_*.xml *.png *.jpg *.jpeg *.webp; do
          [ -f "$f" ] && cp "$f" project/app/src/main/res/drawable/ || true
        done
        for f in ic_launcher.xml ic_launcher_round.xml; do
          [ -f "$f" ] && cp "$f" project/app/src/main/res/mipmap-anydpi-v26/ || true
        done

        # 12. Copy ProGuard rules
        if [ -f app/proguard-rules.pro ]; then
          cp app/proguard-rules.pro project/app/proguard-rules.pro
        elif [ -f proguard-rules.pro ]; then
          cp proguard-rules.pro project/app/proguard-rules.pro
        fi

    - name: Build Debug APK + Release APK
      env:
        STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
      run: |
        set -o pipefail
        cd project
        gradle assembleDebug assembleRelease --stacktrace 2>&1 | tee build_log.txt

    - name: Write error.md on failure
      if: failure()
      run: |
        {
          echo '# Build Failed'
          echo
          echo '```'
          tail -n 300 project/build_log.txt 2>/dev/null || echo 'No Gradle log captured.'
          echo '```'
        } > error.md

    - name: Upload error log
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: error-log
        path: error.md

    - name: Upload Debug APK
      if: success() || always()
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: project/app/build/outputs/apk/debug/*.apk
        if-no-files-found: ignore

    - name: Upload Release APK
      if: success() || always()
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-apk
        path: project/app/build/outputs/apk/release/*.apk
        if-no-files-found: ignore
